<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F7F7F3"/>
      <stop offset="100%" stop-color="#EEF2E8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D7A8F"/>
      <stop offset="50%" stop-color="#6FA82A"/>
      <stop offset="100%" stop-color="#8D5B2A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6FA82A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6FA82A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow circle (soft green) -->
  <circle cx="1000" cy="450" r="400" fill="url(#glow)"/>

  <!-- Water ripples -->
  <circle cx="1000" cy="450" r="180" fill="none" stroke="#3D7A8F" stroke-width="1" opacity="0.15"/>
  <circle cx="1000" cy="450" r="120" fill="none" stroke="#3D7A8F" stroke-width="1" opacity="0.2"/>
  <circle cx="1000" cy="450" r="60" fill="none" stroke="#3D7A8F" stroke-width="1" opacity="0.25"/>

  <!-- Logo icon (top left) -->
  <g transform="translate(80, 70) scale(2.5)">
    <path d="M2 26 Q8 24 16 26 T30 26" stroke="#3D7A8F" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M16 26 L16 12" stroke="#6FA82A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M16 18 Q10 16 9 10 Q15 11 16 18" fill="#6FA82A"/>
    <path d="M16 16 Q22 13 23 7 Q17 8 16 16" fill="#8D5B2A"/>
    <circle cx="16" cy="10" r="2.2" fill="#6B4E9E"/>
    <circle cx="14" cy="12" r="1.4" fill="#8B6FC4"/>
    <circle cx="18" cy="12" r="1.4" fill="#8B6FC4"/>
  </g>

  <!-- Brand name -->
  <text x="190" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#1F2420" letter-spacing="-0.5">
    HYA MATLA
  </text>
  <text x="190" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#8D5B2A" letter-spacing="3">
    ORGANICS
  </text>

  <!-- Tagline -->
  <text x="80" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#4E7A1F" letter-spacing="4">
    ORGANIC FERTILIZER · SOUTH AFRICA
  </text>

  <!-- Main headline -->
  <text x="80" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="800" fill="#1F2420" letter-spacing="-2">
    Turning water&apos;s worst weed
  </text>
  <text x="80" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="800" fill="url(#accent)" letter-spacing="-2">
    into Africa&apos;s best soil
  </text>

  <!-- Supporting line -->
  <text x="80" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#5F6B5E">
    Hya Power — 100% organic fertilizer from invasive water hyacinth.
  </text>

  <!-- Badges (bottom right) -->
  <g transform="translate(690, 545)">
    <rect x="0" y="0" width="130" height="38" rx="19" fill="#FFFFFF" stroke="#6FA82A" stroke-width="1.5"/>
    <text x="65" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#4E7A1F" text-anchor="middle" letter-spacing="0.5">
      ECOCERT SA
    </text>

    <rect x="145" y="0" width="130" height="38" rx="19" fill="#FFFFFF" stroke="#3D7A8F" stroke-width="1.5"/>
    <text x="210" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#3D7A8F" text-anchor="middle" letter-spacing="0.5">
      16 NUTRIENTS
    </text>

    <rect x="290" y="0" width="140" height="38" rx="19" fill="#FFFFFF" stroke="#8D5B2A" stroke-width="1.5"/>
    <text x="360" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#8D5B2A" text-anchor="middle" letter-spacing="0.5">
      100% ORGANIC
    </text>
  </g>
</svg>