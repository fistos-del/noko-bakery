  <text x="160" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#E85A24" letter-spacing="-0.5">
    JORUD
  </text>
  <text x="160" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#1B4965" letter-spacing="4">
