    <line x1="100" y1="0" x2="1300" y2="1200" stroke="#E85A24" stroke-width="2"/>
    <line x1="200" y1="0" x2="1400" y2="1200" stroke="#E85A24" stroke-width="2"/>
    <line x1="300" y1="0" x2="1500" y2="1200" stroke="#E85A24" stroke-width="2"/>
  </g>

  <!-- Orange top bar -->
  <rect x="0" y="0" width="1200" height="8" fill="#E85A24"/>

  <!-- Logo (top left) -->
  <g transform="translate(80, 70)">
    <circle cx="30" cy="30" r="30" fill="#E85A24"/>
    <circle cx="30" cy="30" r="28" fill="none" stroke="#1B4965" stroke-width="1.5"/>
    <g fill="white">
      <path d="M30 12 L28.4 18 L31.6 18 Z"/>
      <path d="M22 14 L21 19 L24.5 17.5 Z"/>
      <path d="M38 14 L35.5 17.5 L39 19 Z"/>
      <path d="M14 20 L15 24 L18 21.5 Z"/>
      <path d="M46 20 L42 21.5 L45 24 Z"/>
      <ellipse cx="30" cy="30" rx="8" ry="9"/>
      <circle cx="27.5" cy="27" r="1.3" fill="#E85A24"/>
      <circle cx="32.5" cy="27" r="1.3" fill="#E85A24"/>
      <ellipse cx="30" cy="31" rx="1.5" ry="1" fill="#E85A24"/>
    </g>
